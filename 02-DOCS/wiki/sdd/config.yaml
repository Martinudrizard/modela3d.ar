  coverage:
    available: false
    command: null
  quality:
    linter: unavailable
    type_checker: unavailable
    formatter: unavailable
  known_gap: >-
    The two frontend test files assert on source text via regex instead of executing code.
    They are not behavioural coverage. Frontend behaviour must gain executable tests
    before the storefront is refactored.

review_budget:
  line_budget: 400

sdd:
  autopilot: false
  review_budget:
    line_budget: 400
  registry_path: .atl/skill-registry.md
